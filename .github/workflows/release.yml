name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write # push the tag and create the release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, to see whether this version is already released
      - name: Tag and release the package.json version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release.py
