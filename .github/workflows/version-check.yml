name: Version check

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # base commit and tags for the comparison
      - name: Require a new version for package changes
        run: python3 .github/scripts/check_version.py "${{ github.event.pull_request.base.sha }}"
